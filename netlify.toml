# 自然大叔顧客滿意度調查：舊 Netlify 網址永久轉址到正式網域
# 保留原路徑，例如 /thankyou.html -> https://survey.naturaluncle.com/thankyou.html
# 這條規則只匹配舊的 surveysatisfaction.netlify.app，不會影響正式網域上的 API / Functions。
[[redirects]]
  from = "https://surveysatisfaction.netlify.app/*"
  to = "https://survey.naturaluncle.com/:splat"
  status = 301
  force = true

[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"

[[redirects]]
  from = "/api/submit"
  to = "/.netlify/functions/submit"
  status = 200

[[redirects]]
  from = "/api/settings"
  to = "/.netlify/functions/settings"
  status = 200

# 搜尋引擎隱私：問卷僅提供已服務顧客使用，不建立 Google 索引。
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/api/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
